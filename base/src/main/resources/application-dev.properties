spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:core}
spring.datasource.username=${POSTGRES_USER:user}
spring.datasource.password=${POSTGRES_PASSWORD:password}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.password-reset.token-expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:30}
app.password-reset.reset-url=${FRONTEND_RESET_PASSWORD_URL}
app.email-verification.token-expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:1440}
app.email-verification.verification-url=${FRONTEND_VERIFY_EMAIL_URL}

logging.level.br.com.template.core=${LOG_LEVEL:DEBUG}

spring.flyway.locations=classpath:db/migration,classpath:db/migration-dev
spring.flyway.out-of-order=true
spring.flyway.placeholders.seedAdminName=${SEED_ADMIN_NAME:Admin Dev}
spring.flyway.placeholders.seedAdminEmail=${SEED_ADMIN_EMAIL}
spring.flyway.placeholders.seedAdminPasswordHash=${SEED_ADMIN_PASSWORD_HASH}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

server.forward-headers-strategy=framework
