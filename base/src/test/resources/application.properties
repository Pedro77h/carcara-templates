spring.application.name=core
app.name=core

spring.datasource.url=jdbc:h2:mem:coretest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-test
spring.flyway.target=latest

app.jwt.secret=dGVtcGxhdGUtdGVzdC1zZWNyZXQtY2hhbmdlLW1lLTMyYnl0ZXMhIQ==
app.jwt.issuer=core
app.jwt.access-token-expiration-minutes=60
app.jwt.refresh-token-expiration-days=7

app.cors.allowed-origins=http://localhost:3000

app.auth.email-verification-required=true

app.password-reset.token-expiration-minutes=30
app.password-reset.reset-url=http://localhost:3000/reset-password
app.email-verification.token-expiration-minutes=1440
app.email-verification.verification-url=http://localhost:3000/verificar-email

spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
