# Representação estruturada das AI rules para integrações automatizadas.
# Fonte de verdade: AI_RULES.md na raiz. Não editar um sem editar os outros.

alwaysApply: true
rules:
  - id: test-coverage-gate
    description: "Cobertura de testes unitários (JUnit 5 + BDDMockito + AssertJ, given/when/then) deve ficar >= 80%"
    paths:
      - "src/test/**"
    enforcement:
      - type: coverage_threshold
        minPercent: 80
        tool: jacoco
        report: "target/site/jacoco/jacoco.csv"

  - id: follow-architecture
    description: "Preservar a estrutura por módulo e a direção de dependência: controller -> só components; components -> components de outros módulos e services do próprio módulo; services -> repositories e outros services, nunca components. Detalhe em docs/arquitetura/ARQUITETURA.md"
    paths:
      - "src/main/java/**"
    enforcement:
      - type: guidance

  - id: no-new-deps
    description: "Não instalar novas dependências sem aprovação do mantenedor"
    paths:
      - "pom.xml"
    enforcement:
      - type: approval_required

  - id: query-in-database
    description: "Consultar no banco, nunca em memória: JPQL para consulta fixa, Specification (mapper monta, repositório estende JpaSpecificationExecutor) para filtro opcional ou combinável"
    paths:
      - "src/main/java/**/repositories/**"
      - "src/main/java/**/mappers/**"
    enforcement:
      - type: guidance

  - id: avoid-nplus1
    description: "Evitar N+1; usar fetch joins/EntityGraph"
    paths:
      - "src/main/java/**"
    enforcement:
      - type: guidance

  - id: minimize-tokens
    description: "Promover prompts concisos ao interagir com IAs"
    enforcement:
      - type: guidance

  - id: prefer-objects-null-checks
    description: "Usar Objects.isNull(x)/Objects.nonNull(x) em vez de x == null / x != null"
    paths:
      - "src/main/java/**"
      - "src/test/java/**"
    enforcement:
      - type: guidance

  - id: no-code-comments
    description: "Nunca escrever comentários no código-fonte (// ou /** */), inclusive em testes; exceção: Javadoc exigido por ferramentas externas (ex: OpenAPI @Schema/@Operation)"
    paths:
      - "src/main/java/**"
      - "src/test/java/**"
    enforcement:
      - type: guidance

  - id: flyway-only-schema-changes
    description: "Mudança de schema só via migration Flyway em db/migration; ddl-auto fica em validate; migration já aplicada nunca é editada; dado de demonstração só em db/migration-dev"
    paths:
      - "src/main/resources/db/**"
      - "src/main/java/**/models/**"
    enforcement:
      - type: guidance

  - id: personal-data-care
    description: "Dado pessoal novo precisa de finalidade declarada; nunca logar dado pessoal, token ou credencial (logs citam só identificadores técnicos); consulta de dado de usuário escopada pelo dono na própria query, com 404 e nunca 403 para registro de terceiro"
    paths:
      - "src/main/java/**"
    enforcement:
      - type: guidance

  - id: living-api-doc
    description: "Todo endpoint novo ou alterado entra em docs/arquitetura/API.md no mesmo PR: método, autorização, campos e validações, resposta, erros e curl de exemplo"
    paths:
      - "src/main/java/**/controller/**"
      - "docs/arquitetura/API.md"
    enforcement:
      - type: guidance

  - id: builder-not-record-for-response-dtos
    description: "DTO de resposta e objeto de conversão de mapper usam classe com @Getter @Builder @NoArgsConstructor @AllArgsConstructor; record fica só para DTO de request validado com @Valid"
    paths:
      - "src/main/java/**/dtos/**"
      - "src/main/java/**/mappers/**"
    enforcement:
      - type: guidance

  - id: risk-proportional-validation
    description: "Validar proporcionalmente ao risco e provar o fluxo ponta a ponta: baixo risco sem teste, medio risco com teste do que mudou, alto risco (auth, roles, multi-tenancy, migration, entidade, config/, contrato de API, scheduler, fila) com ./mvnw verify mais validacao e2e do fluxo. ./mvnw verify nao abre a aplicacao. Nunca inventar resultado: dizer o que rodou, o que nao rodou, o comando recomendado e o risco residual. Referencia: docs/validacao/VALIDACAO.md"
    paths:
      - "src/main/java/**"
      - "src/main/resources/db/**"
      - "src/test/java/**"
    enforcement:
      - type: guidance

  - id: findings-registry
    description: "Achado (bug, gap, inconsistencia, risco operacional) vai em docs/achados/REGISTRO_ACHADOS.md, nunca em arquivo avulso. Porta estreita: so entra severidade alta/critica, ou qualquer severidade de origem externa (usuario, homologacao, falha de teste ou de porta de qualidade), ou pedido explicito. Achado baixo/medio encontrado pela propria IA revisando o proprio trabalho nao entra. Achado encerrado vai para docs/achados/REGISTRO_ACHADOS_ARQUIVO.md; defeito que volta e achado novo citando o arquivado. Teto de 30 abertos, verificado no pre-push"
    paths:
      - "docs/achados/REGISTRO_ACHADOS.md"
      - "docs/achados/REGISTRO_ACHADOS_ARQUIVO.md"
    enforcement:
      - type: guidance

review:
  role: comment-only
  description: "A IA aponta pontos de atenção como comentários; nunca aprova nem reprova PRs"
