spring.application.name=core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
app.name=${APP_NAME:core}

spring.datasource.url=jdbc:postgresql://localhost:5432/core
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.target=latest

management.endpoints.web.exposure.include=health,info

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:core}
app.jwt.access-token-expiration-minutes=60
app.jwt.refresh-token-expiration-days=7

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

app.auth.email-verification-required=${AUTH_EMAIL_VERIFICATION_REQUIRED:true}
app.auth.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.auth.rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
app.auth.rate-limit.max-attempts-per-origin=${AUTH_RATE_LIMIT_MAX_ATTEMPTS_PER_ORIGIN:20}
app.auth.rate-limit.block-minutes=${AUTH_RATE_LIMIT_BLOCK_MINUTES:60}
app.auth.rate-limit.retention-hours=${AUTH_RATE_LIMIT_RETENTION_HOURS:8}

app.users.inactivity-months=${USERS_INACTIVITY_MONTHS:6}

app.security.pseudonym-secret=${PSEUDONYM_SECRET:}

spring.mvc.log-request-details=false
