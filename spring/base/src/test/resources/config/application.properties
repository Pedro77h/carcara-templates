# Sobrescritas de teste. Fica em config/ de propósito: o Spring Boot carrega este arquivo POR CIMA
# do src/main/resources/application.properties, em vez de no lugar dele. Assim toda propriedade
# nova do principal (inclusive as que as features acrescentam) chega aos testes sem duplicar.
# Só entra aqui o que precisa ser diferente em teste.

# Sem isso o default "local" do principal ativaria application-local.properties (Postgres, seed).
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:coretest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.locations=classpath:db/migration,classpath:db/migration-test

app.jwt.secret=dGVtcGxhdGUtdGVzdC1zZWNyZXQtY2hhbmdlLW1lLTMyYnl0ZXMhIQ==

# Só existem nos perfis local/dev/prod.
app.password-reset.token-expiration-minutes=30
app.password-reset.reset-url=http://localhost:3000/reset-password
app.email-verification.token-expiration-minutes=1440
app.email-verification.verification-url=http://localhost:3000/verificar-email
spring.mail.host=
