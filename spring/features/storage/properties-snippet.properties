# Armazenamento de arquivo (feature storage). Em produção aponte para um volume persistente.
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-dir=${STORAGE_LOCAL_DIR:${java.io.tmpdir}/${spring.application.name}-uploads}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}
